<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Helpdesk{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('submit') }}">Submit ticket</a>
    {% if g.current_user %}
    <a href="{{ url_for('staff_dashboard') }}">Dashboard</a>
    <a href="{{ url_for('staff_queue') }}">Queue</a>
    {% else %}
    <a href="{{ url_for('staff_dashboard') }}">Staff</a>
    {% endif %}
    <span class="spacer"></span>
    {% if g.current_user %}
      <span class="who">Signed in as <strong>{{ g.current_user.username }}</strong></span>
      <form method="post" action="{{ url_for('logout') }}" class="logout">
        <button type="submit">Sign out</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Staff sign in</a>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
