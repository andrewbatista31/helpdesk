<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Helpdesk{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('submit') }}">Submit ticket</a>
    {% if g.current_user %}
    <a href="{{ url_for('staff_dashboard') }}">Dashboard</a>
    <a href="{{ url_for('staff_queue') }}">Queue</a>
    <details class="nav-menu">
      <summary aria-label="More">&#9776; More</summary>
      <div class="menu-content" role="menu">
        <a href="{{ url_for('staff_recurring_list') }}" role="menuitem">Recurring schedules</a>
        <a href="{{ url_for('staff_licenses_list') }}" role="menuitem">Software licenses</a>
      </div>
    </details>
    {% else %}
    <a href="{{ url_for('staff_dashboard') }}">Staff</a>
    {% endif %}
    <span class="spacer"></span>
    {% if g.current_user %}
      <span class="who">Signed in as <strong>{{ g.current_user.username }}</strong></span>
      <form method="post" action="{{ url_for('logout') }}" class="logout">
        <button type="submit">Sign out</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Staff sign in</a>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>

  <script>
    // Close any open header dropdown when clicking outside of it.
    document.addEventListener('click', function (e) {
      document.querySelectorAll('details.nav-menu[open]').forEach(function (d) {
        if (!d.contains(e.target)) d.removeAttribute('open');
      });
    });
    // Esc closes any open dropdown too.
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        document.querySelectorAll('details.nav-menu[open]').forEach(function (d) {
          d.removeAttribute('open');
        });
      }
    });
  </script>
</body>
</html>
