{% extends "base.html" %}
{% block title %}Staff login{% endblock %}
{% block content %}
<h1>Staff login</h1>

{% if error %}
<ul class="errors"><li>{{ error }}</li></ul>
{% endif %}

<form method="post" class="stacked" autocomplete="on">
  <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
  <label>Username
    <input name="username" value="{{ username or '' }}" autocomplete="username" autofocus required>
  </label>
  <label>Password
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
