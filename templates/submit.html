{% extends "base.html" %}
{% block title %}Submit a ticket{% endblock %}
{% block content %}
<h1>Submit a ticket</h1>
<p>Tell IT what you need help with. You'll get email updates as we work on it.</p>

{% if errors %}
<ul class="errors">
  {% for e in errors %}<li>{{ e }}</li>{% endfor %}
</ul>
{% endif %}

<form method="post" class="stacked">
  <label>Your name
    <input name="name" value="{{ form.name or '' }}" required>
  </label>
  <label>Email
    <input type="email" name="email" value="{{ form.email or '' }}" required>
  </label>
  <label>Subject
    <input name="subject" value="{{ form.subject or '' }}" required>
  </label>
  <label>Priority
    <select name="priority">
      {% for p in priorities %}
        <option value="{{ p }}" {% if (form.priority or 'normal') == p %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Description
    <textarea name="description" rows="6" required>{{ form.description or '' }}</textarea>
  </label>
  <button type="submit">Submit ticket</button>
</form>
{% endblock %}
